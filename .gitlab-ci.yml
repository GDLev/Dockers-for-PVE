stages: [check, package]

# Project runner for these disposable Linux jobs.
default:
  tags: [betterdockers-linux]

python:
  stage: check
  image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
  script:
    - bash scripts/ci-dependencies.sh
    - python -m pip install --require-hashes -r requirements-test.txt
    - env PATH=/opt/betterdocker-ci-python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin /opt/betterdocker-ci-python/bin/python /opt/betterdocker-ci-source/tests/check_release_ci.py
    - python tests/check_unit.py
    - bash -n install.sh start.sh scripts/docker-install.sh packaging/build-deb.sh

frontend:
  stage: check
  image: node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
  before_script:
    - apt-get update && apt-get install -y python3
  script:
    - python3 scripts/build_frontend.py | node --check
    - node tests/test_frontend.js

package:
  stage: package
  image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
  script:
    - bash packaging/build-deb.sh
    - bash packaging/build-release.sh
    - python tests/check_release_artifacts.py
    - dpkg-deb --info dist/*.deb
    - dpkg-deb --contents dist/*.deb
    - sha256sum dist/*.deb > dist/SHA256SUMS
    - echo "Unsigned build artifacts. Sign separately after reviewing this commit and required check results."
  artifacts:
    paths: [dist/]
    expire_in: 30 days

